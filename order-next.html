<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>購入後のつづき | あませ / paper-daemon</title><meta name="description" content="paper-daemon 有料枠の購入後に必要な素材と次の流れ。"><link rel="canonical" href="https://paper-daemon.github.io/order-next.html"><link rel="stylesheet" href="/style.css"><style>body{background:#17191d;color:#f6f1e8}.order{width:min(820px,92vw);margin:8vh auto;padding:32px}.order a{color:#9fd8bf}.order h1{font-family:'Hiragino Mincho ProN','Yu Mincho','YuMincho',serif;font-size:clamp(2.7rem,8vw,5rem);line-height:1.02}.order .box{margin-top:28px;padding:22px;border:1px solid #ffffff22;border-radius:20px;background:#ffffff09}.order .k{font:700 .7rem ui-monospace,monospace;letter-spacing:.08em;color:#9fd8bf}.order ul{line-height:1.9;color:#c8cdd0}.order code{display:block;padding:12px;background:#0d0f12;color:#dff5e7;border-radius:12px;white-space:normal}.muted{color:#98a0a4;font-size:.78rem}</style></head><body><main class="order"><p class="k">PAYMENT RECEIVED / NEXT STEP</p><h1>ありがとう。<br>次は素材だけ。</h1><p id="intro">決済内容を確認して、必要なものだけ受け取って進めます。</p><section class="box"><p class="k" id="sku-label">PAID LANE</p><h2 id="service-name">購入内容を確認中</h2><ul id="needs"><li>Stripeの決済メールはそのまま残しておいてください。</li><li>登録メール宛に、必要素材の受け渡し方法を案内します。</li></ul><code id="boundary">固定料金の外まで勝手に広げません。範囲外なら作業開始前に止めて相談します。</code></section><p class="muted">秘密情報・APIキー・パスワードを公開URLやGitHub Issueへ貼らないでください。必要な場合も安全な受け渡し方法を先に決めます。</p><p><a href="/">← 作業机へ戻る</a>　<a href="/showcase.html">商品・OSS・デモを見る →</a></p></main><script>(()=>{const q=new URLSearchParams(location.search),sku=q.get('sku')||'';const d={repo:['Public Repo Health Audit',['対象の公開GitHub repo URL','特に気になっている点があれば1〜3個']],csv:['CSV Cleanup & QA',['対象CSV/TSV 1ファイル','残したい列・消したくない値などの条件']],srt:['SRT Subtitle QA',['対象SRT 1本','動画尺または基準動画がある場合はその情報']],media:['Media Delivery QA',['対象動画/音声 最大3本','納品先の指定条件があればその条件']],comfyui:['ComfyUI Workflow Cleanup',['workflow JSON 1本','missing/custom nodeで困っている点があればメモ']],site:['Site Launch Preflight',['対象サイトURL','公開前なら確認できる共有URL','特に気になるページがあれば指定']]}[sku];if(!d)return;document.querySelector('#service-name').textContent=d[0];document.querySelector('#sku-label').textContent=sku.toUpperCase();document.querySelector('#needs').innerHTML=d[1].map(x=>`<li>${x}</li>`).join('')+'<li>Stripeの決済メールはそのまま残しておいてください。</li><li>登録メール宛に受け渡し方法を案内します。</li>'})()</script></body></html>
