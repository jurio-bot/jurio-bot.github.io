name: Production demo browser integrity

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for Amase V3 demo UI to reach GitHub Pages
        run: |
          for i in {1..48}; do
            body="$(curl -fsS --max-time 12 "https://paper-daemon.github.io/demo-amase-v3.js?run=${GITHUB_RUN_ID}" || true)"
            if printf '%s' "$body" | grep -q 'PD_AMASE_DEMO_V3_20260903_1'; then
              echo 'Production Amase V3 UI is current.'
              exit 0
            fi
            echo "Waiting for Pages deploy ($i/48)..."
            sleep 5
          done
          echo 'Timed out waiting for production Amase V3 UI.'
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real processing tests against production URL
        env:
          DEMO_BASE_URL: https://paper-daemon.github.io
        run: node tests/demo-real-browser.mjs
      - name: Verify Amase mobile result UI
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await page.goto('https://paper-daemon.github.io/demo-view.html?id=svc-entry-100',{waitUntil:'networkidle'});
            await page.waitForSelector('.amase-flow');
            const labels=await page.locator('.amase-flow').innerText();
            if(!labels.includes('入れる')||!labels.includes('動かす')||!labels.includes('見る')) throw new Error('Amase three-step flow missing');
            const start=page.locator('#de-start');
            const box=await start.boundingBox();
            if(!box||box.width<44||box.height<44) throw new Error(`RUN button too small: ${JSON.stringify(box)}`);
            let overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(overflow>1) throw new Error(`mobile page overflows before run by ${overflow}px`);
            await start.click();
            await page.waitForFunction(()=>Number(document.querySelector('#m-output')?.textContent||0)>0,null,{timeout:20000});
            await page.waitForFunction(()=>{const e=document.querySelector('#amase-artifact');return e&&!e.querySelector('.amase-empty')&&(e.textContent||'').trim().length>0},null,{timeout:10000});
            const result=await page.locator('#amase-artifact').innerText();
            if(!result||/run the process|まだ実行/i.test(result)) throw new Error('Amase artifact did not render');
            if(await page.locator('#amase-artifact .real-output-preview').count()>0) throw new Error('raw output leaked into primary result');
            overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(overflow>1) throw new Error(`mobile page overflows after run by ${overflow}px`);
            await page.locator('#amase-tech > summary').click();
            if(!(await page.locator('#amase-tech').evaluate(e=>e.open))) throw new Error('technical evidence drawer did not open');
            console.log('PRODUCTION_AMASE_MOBILE_OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify Amase desktop layout
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('https://paper-daemon.github.io/demo-view.html?id=work-agentlink',{waitUntil:'networkidle'});
            await page.waitForSelector('.amase-result');
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            if(overflow>1) throw new Error(`desktop page overflows by ${overflow}px`);
            const bg=await page.evaluate(()=>getComputedStyle(document.body).backgroundColor);
            if(bg==='rgb(16, 16, 15)') throw new Error('old dark demo theme still active');
            console.log('PRODUCTION_AMASE_DESKTOP_OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
