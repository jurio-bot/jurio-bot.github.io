name: Sitemap integrity

on:
  push:
    paths:
      - 'notes/**.html'
      - 'sitemap.xml'
      - '.github/workflows/sitemap-integrity.yml'
  pull_request:
    paths:
      - 'notes/**.html'
      - 'sitemap.xml'
      - '.github/workflows/sitemap-integrity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify note indexability and canonical URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          errors = []
          base = 'https://paper-daemon.github.io/'

          for path in sorted(Path('notes').glob('*.html')):
              raw = path.read_text(encoding='utf-8')
              html = raw.lower()
              if path.name == 'index.html':
                  url = f"{base}{path.parent.as_posix().rstrip('/')}/"
              else:
                  url = f'{base}{path.as_posix()}'

              robots_match = re.search(r'<meta[^>]+name=["\']robots["\'][^>]*>', html)
              noindex = bool(robots_match and 'noindex' in robots_match.group(0))
              canonical_match = re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)["\']', raw, re.I)

              if noindex:
                  if url in sitemap:
                      errors.append(f'noindex note must not be in sitemap: {url}')
                  continue

              if url not in sitemap:
                  errors.append(f'indexed note missing from sitemap: {url}')

              if not canonical_match:
                  errors.append(f'indexed note missing canonical: {path.as_posix()}')
              elif canonical_match.group(1) != url:
                  errors.append(f'canonical mismatch: {path.as_posix()} -> {canonical_match.group(1)} (expected {url})')

          if errors:
              raise SystemExit('\n'.join(errors))
          print('Indexed/noindex note and canonical/sitemap consistency verified')
          PY
