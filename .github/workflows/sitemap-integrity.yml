name: Sitemap integrity

on:
  push:
    paths:
      - 'notes/**.html'
      - 'sitemap.xml'
      - '.github/workflows/sitemap-integrity.yml'
  pull_request:
    paths:
      - 'notes/**.html'
      - 'sitemap.xml'
      - '.github/workflows/sitemap-integrity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require indexed notes in sitemap
        run: |
          python - <<'PY'
          from pathlib import Path

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          missing = []
          for path in sorted(Path('notes').glob('*.html')):
              html = path.read_text(encoding='utf-8').lower()
              if 'name="robots"' in html and ('noindex' in html.split('name="robots"', 1)[1].split('>', 1)[0]):
                  continue
              url = f'https://paper-daemon.github.io/{path.as_posix()}'
              if url not in sitemap:
                  missing.append(url)

          if missing:
              raise SystemExit('Indexed note(s) missing from sitemap:\n' + '\n'.join(missing))
          print('All indexed notes are present in sitemap.xml')
          PY
