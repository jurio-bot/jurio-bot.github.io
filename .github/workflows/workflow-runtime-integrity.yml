name: Workflow runtime integrity

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject stale checkout runtime
        shell: python
        run: |
          from pathlib import Path

          errors = []
          stale = 'actions/checkout@' + 'v4'
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              if stale in text:
                  errors.append(f'{path}: uses stale checkout runtime')

          if errors:
              raise SystemExit('\n'.join(errors))

          print('All workflow checkout actions use v5 or newer')
