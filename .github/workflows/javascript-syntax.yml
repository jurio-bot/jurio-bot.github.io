name: JavaScript syntax integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current interactive JavaScript
        run: |
          for file in \
            demo-hub.js \
            work-demos.js \
            demo-catalog.js \
            demo-menu.js \
            demo-engine.js \
            demo-real-engine.js \
            demo-visible-runtime.js \
            demo-ui-v2.js \
            demo-amase-v3.js
          do
            test -f "$file"
            node --check "$file"
          done
