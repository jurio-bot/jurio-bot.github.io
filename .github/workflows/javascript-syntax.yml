name: JavaScript syntax integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check interactive demo JavaScript
        run: |
          node --check recovery-demo.js
          node --check multi-demos.js
          node --check demo-hub.js
